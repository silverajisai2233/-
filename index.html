<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訪問報告書作成</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --main-color:#2f6f68;
    --main-dark:#204d47;
    --accent-color:#e08a3c;
    --bg-color:#f5f3ee;
    --card-bg:#ffffff;
    --border-color:#dcd6c8;
    --text-color:#333333;
    --danger-color:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg-color);
    color:var(--text-color);
    padding-bottom:100px;
  }
  header{
    background:var(--main-color);
    color:#fff;
    padding:16px 20px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  header h1{margin:0;font-size:18px;font-weight:600;}
  header p{margin:4px 0 0;font-size:12px;opacity:0.85;}
  main{max-width:720px;margin:0 auto;padding:16px;}
  section.card{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:10px;
    padding:16px;
    margin-bottom:18px;
  }
  section.card h2{
    font-size:15px;
    margin:0 0 12px;
    color:var(--main-dark);
    border-left:5px solid var(--accent-color);
    padding-left:8px;
  }
  label{display:block;font-size:12px;color:#666;margin:10px 0 4px;}
  input[type="text"], input[type="date"], textarea, select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border-color);
    border-radius:6px;
    font-size:15px;
    font-family:inherit;
    background:#fff;
  }
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .loc-card{
    border:1px solid var(--border-color);
    border-radius:8px;
    padding:12px;
    margin-bottom:14px;
    background:#fbfaf6;
    position:relative;
  }
  .loc-card-head{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .loc-card-head select{flex:1;}
  .btn{
    display:inline-block;
    border:none;
    border-radius:6px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .btn-main{background:var(--main-color);color:#fff;}
  .btn-main:active{background:var(--main-dark);}
  .btn-outline{background:#fff;color:var(--main-color);border:1px solid var(--main-color);}
  .btn-danger{background:#fff;color:var(--danger-color);border:1px solid var(--danger-color);font-size:12px;padding:6px 10px;}
  .btn-add{width:100%;background:#eef4f1;color:var(--main-dark);border:1px dashed var(--main-color);padding:12px;font-size:14px;}
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .photo-thumb{position:relative;width:88px;height:88px;border-radius:6px;overflow:hidden;border:1px solid var(--border-color);}
  .photo-thumb img{width:100%;height:100%;object-fit:contain;background:#eee;display:block;}
  .photo-thumb button{
    position:absolute;top:2px;right:2px;
    background:rgba(192,57,41,0.9);color:#fff;border:none;border-radius:50%;
    width:20px;height:20px;font-size:12px;line-height:20px;padding:0;cursor:pointer;
  }
  .photo-add-btn{
    width:88px;height:88px;border-radius:6px;border:1px dashed var(--main-color);
    background:#eef4f1;color:var(--main-color);font-size:12px;display:flex;
    align-items:center;justify-content:center;text-align:center;cursor:pointer;
  }
  .loc-remove{position:absolute;top:8px;right:8px;}
  .footer-actions{
    position:fixed;bottom:0;left:0;right:0;
    background:#fff;border-top:1px solid var(--border-color);
    padding:10px 16px;display:flex;gap:10px;z-index:20;
    box-shadow:0 -2px 8px rgba(0,0,0,0.08);
  }
  .footer-actions .btn{flex:1;}
  #statusMsg{
    position:fixed;top:70px;left:50%;transform:translateX(-50%);
    background:var(--main-dark);color:#fff;padding:8px 16px;border-radius:20px;
    font-size:13px;z-index:30;display:none;
  }
  .small-link{background:none;border:none;color:var(--main-color);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}
  .two-col{display:flex;gap:10px;}
  .two-col > div{flex:1;}
</style>
</head>
<body>

<header>
  <h1 id="appTitleHeading">訪問報告書作成</h1>
  <p>撮影・入力してPDFまたはExcelを書き出します</p>
</header>

<div id="statusMsg"></div>

<main>

  <section class="card">
    <h2>書類の種類</h2>
    <select id="docTypeSelect"></select>
  </section>

  <section class="card">
    <h2>基本情報</h2>
    <label>対象利用者</label>
    <input type="text" id="f_taisho" placeholder="〇〇 〇〇 様">
    <label>実施日</label>
    <input type="date" id="f_jisshibi">
    <label>実施場所</label>
    <input type="text" id="f_basho" placeholder="〇〇様自宅（神戸市北区）">
    <label>参加メンバー</label>
    <textarea id="f_member" placeholder="ご家族名・本人・同行職員など"></textarea>
    <label>報告者</label>
    <input type="text" id="f_hokokusha" placeholder="シルバーステイあじさい　理学療法士　〇〇 〇〇">
    <label>目的</label>
    <textarea id="f_mokuteki" placeholder="住宅環境の評価、本人・家族への指導など"></textarea>
  </section>

  <section class="card">
    <h2>住宅環境評価</h2>
    <div id="locationsContainer"></div>
    <button class="btn-add" id="btnAddLocation">＋ 場所を追加</button>
  </section>

  <section class="card">
    <h2>まとめ・考察</h2>
    <div id="summaryFieldsContainer"></div>
    <div class="two-col">
      <div>
        <label>会議実施日</label>
        <input type="date" id="s_kaigidate">
      </div>
      <div>
        <label>参加者</label>
        <input type="text" id="s_sankasha" placeholder="PT〇〇、CM〇〇、CW〇〇、NS〇〇">
      </div>
    </div>
  </section>

  <section class="card">
    <h2>作業の保存・再開</h2>
    <p style="font-size:12px;color:#666;margin:0 0 10px;">スマホで途中まで入力した内容(写真・文章)を1つのファイルに保存し、パソコンなど別の端末に送って続きを入力できます。</p>
    <button class="btn btn-outline" id="btnSaveProgress" style="width:100%;margin-bottom:10px;">作業データを保存</button>
    <label class="btn btn-outline" style="width:100%;display:block;text-align:center;">
      作業データを読み込む
      <input type="file" id="progressFileInput" accept="application/json,.json" style="display:none;">
    </label>
  </section>

  <button class="btn btn-outline" style="width:100%;margin-bottom:40px;" id="btnReset">入力内容をすべてクリア</button>

</main>

<div class="footer-actions">
  <button class="btn btn-outline" id="btnExcel">Excel作成</button>
  <button class="btn btn-main" id="btnPdf">PDF作成</button>
</div>

<script>
/* ============ 書類の種類ごとの設定 ============ */
const DOC_TYPES = {
  nyusho: {
    label: '入所前後訪問',
    title: '入所前後訪問指導',
    locations: ['門扉〜玄関','玄関','廊下','トイレ','居室','寝室','浴室','その他'],
    memoPresets: {
      '門扉〜玄関': '階段の高さ：\n階段の段数：　　段\n手すりの有無（　　）\nその他：',
      '玄関':      '上がり框の高さ：　　㎝\n手すりの有無（　　）\nその他：',
      '廊下':      '廊下の幅：\n手すりの有無（　　）\nその他：',
      'トイレ':     '便座の高さ：　　㎝\n手すりの有無（　　）\nその他：',
      '居室':      '机の高さ：\n椅子の高さ：\nその他：',
      '寝室':      'ベッドの高さ：\nベッド柵・手すりの有無（　　）\nその他：',
      '浴室':      '浴槽の高さ：内側　㎝　外側　㎝\nシャワーチェアの高さ：　　㎝\nその他：',
      'その他':     ''
    },
    summary: [
      {key:'yousu', label:'自宅での様子', placeholder:'体調悪化や入院前のADL状況、家庭での役割・参加、介護保険サービスの利用状況、1日の過ごし方、入所に至る経緯など'},
      {key:'seikatsu', label:'入所生活', placeholder:'退所時にどのレベルまでADLや精神機能等を高めていくのか（生活目標）、施設での生活で注意すること、生活リハビリの内容など'},
      {key:'rehabili', label:'リハビリ', placeholder:'リハビリの最終ゴール設定とそれに至るまでの目標、現状の問題点に対する予後予測など'},
      {key:'yotei', label:'今後の予定', placeholder:'自宅に帰った場合の役割、家族への支援依頼、必要な介護保険サービス、住宅環境整備・福祉用具の要否など'}
    ]
  },
  taisho: {
    label: '退所前後訪問',
    title: '退所前後訪問指導',
    locations: ['門扉〜玄関','玄関','廊下','トイレ','居室','寝室','浴室','その他'],
    memoPresets: {
      '門扉〜玄関': '階段の高さ：\n階段の段数：　　段\n手すりの有無（　　）\nその他：',
      '玄関':      '上がり框の高さ：　　㎝\n手すりの有無（　有　）\nその他：',
      '廊下':      '廊下の幅：\n手すりの有無（　　）\nその他：',
      'トイレ':     '便座の高さ：　　㎝\n手すりの有無（　　）\nその他：',
      '居室':      '机の高さ：\n椅子の高さ：\nその他：',
      '寝室':      'ベッドの高さ：\nベッド柵・手すりの有無（　　）\nその他：',
      '浴室':      '浴槽の高さ：内側　㎝　外側　㎝\nシャワーチェアの高さ：　　㎝\nその他：',
      'その他':     ''
    },
    summary: [
      {key:'kaigoryoku', label:'家族の介護力', placeholder:'同居家族／日中・夜間の介護者／家族が行う介助／家族が不安に感じている事　など'},
      {key:'fukushiyogu', label:'福祉用具・住宅改修', placeholder:'訪問をした結果、どのような福祉用具が、なぜ必要か。どのような住宅改修が、なぜ必要か。'},
      {key:'service', label:'退所後に必要なサービス', placeholder:'どのような介護保険サービスが、なぜ必要か。'},
      {key:'taio', label:'訪問後の対応', placeholder:'訪問して何がわかり、退所までに何が必要か。'}
    ]
  },
  rehamane: {
    label: 'リハビリテーションマネジメント',
    title: 'リハビリテーションマネジメント',
    locations: ['門扉〜玄関','玄関','廊下','居室','寝室','トイレ','洗面所','お風呂','台所','ベランダ','その他'],
    memoPresets: {
      '門扉〜玄関': '階段の高さ：　　㎝\n段の数：　　段\n手すりの有無（　　）\nその他：',
      '玄関':      '上がり框の高さ：　　㎝\n手すりの有無（　　）\nその他：',
      '廊下':      '廊下の幅：　　㎝\n手すりの有無（　　）\nその他：',
      '居室':      '椅子の高さ：　　㎝\n机の高さ：　　㎝\n福祉用具の有無（　　）\nその他：',
      '寝室':      'ベッドの高さ：　　㎝\nベッド柵・手すりの有無（　　）\n福祉用具の有無（　　）\nその他：',
      'トイレ':     '便座の高さ：　　㎝\nウォシュレットの有無（　　）\n手すりの有無（　　）\nその他：',
      '洗面所':     '洗面台の高さ：　　㎝\n手すりの有無（　　）\nその他：',
      'お風呂':     'シャワーチェアーの高さ：　　㎝\n浴槽の高さ：外　　㎝　中　　㎝\n手すりの有無（　　）\nその他：',
      '台所':      'キッチンの高さ：　　㎝\n棚の高さ（最大）：　　㎝\n冷蔵庫の高さ（最大）：　　㎝\n福祉用具の有無（　　）\nその他：',
      'ベランダ':    '',
      'その他':     ''
    },
    summary: [
      {key:'kadai', label:'本人の課題', placeholder:'居宅での実際の生活状況から、本人の生活上の課題やその原因を具体的に記載する。'},
      {key:'shido', label:'リハビリテーションの観点からの指導・助言', placeholder:'把握した課題に対して、本人・家族・関係職種へ行った具体的な指導・助言内容を記載する。'},
      {key:'kongo', label:'訪問結果を踏まえた今後のリハビリテーション', placeholder:'居宅訪問で把握した課題を本人の生活目標につなげ、今後の具体的なリハビリ内容・支援方法を記載する。'},
      {key:'renkei', label:'他サービスとの連携', placeholder:'ケアマネジャーや他サービス事業所と共有・調整した内容を記載する。'}
    ]
  }
};

let currentDocType = 'nyusho';
const ASSIST_LEVELS = ['自立', '見守り', '一部介助', '全介助'];

/* ============ 状態 ============ */
let state = {
  header: { taisho:'', jisshibi:'', basho:'', member:'', hokokusha:'', mokuteki:'' },
  locations: [],
  summary: { kaigidate:'', sankasha:'' }
};
let locIdCounter = 0;

/* ============ 基本情報：双方向バインド ============ */
const fieldMap = [
  ['f_taisho','header','taisho'], ['f_jisshibi','header','jisshibi'], ['f_basho','header','basho'],
  ['f_member','header','member'], ['f_hokokusha','header','hokokusha'], ['f_mokuteki','header','mokuteki'],
  ['s_kaigidate','summary','kaigidate'], ['s_sankasha','summary','sankasha']
];
fieldMap.forEach(([id, group, key]) => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => { state[group][key] = el.value; });
});

/* ============ 書類の種類の切り替え ============ */
function getDocType(){ return DOC_TYPES[currentDocType]; }
function getLocationPresets(){ return getDocType().locations; }
function getPresetMemo(preset){ return getDocType().memoPresets[preset] || ''; }

function populateDocTypeSelect(){
  const sel = document.getElementById('docTypeSelect');
  sel.innerHTML = '';
  Object.keys(DOC_TYPES).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = DOC_TYPES[key].label;
    if(key === currentDocType) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    const hasData = state.locations.length > 0 || Object.keys(state.summary).some(k => k !== 'kaigidate' && k !== 'sankasha' && state.summary[k]);
    if(hasData && !confirm('書類の種類を切り替えると、入力済みの「住宅環境評価」と「まとめ・考察」がリセットされます。よろしいですか？')){
      sel.value = currentDocType;
      return;
    }
    currentDocType = sel.value;
    applyDocType();
  });
}

function applyDocType(){
  const docType = getDocType();
  document.getElementById('appTitleHeading').textContent = docType.title + ' 報告書作成';
  document.title = docType.title + ' 報告書作成';

  state.locations = [];
  const newSummary = { kaigidate: state.summary.kaigidate || '', sankasha: state.summary.sankasha || '' };
  docType.summary.forEach(f => { newSummary[f.key] = ''; });
  state.summary = newSummary;

  renderSummaryFields();
  renderLocations();
  addLocation();
}

function renderSummaryFields(){
  const container = document.getElementById('summaryFieldsContainer');
  container.innerHTML = '';
  getDocType().summary.forEach(f => {
    const label = document.createElement('label');
    label.textContent = f.label;
    container.appendChild(label);
    const ta = document.createElement('textarea');
    ta.placeholder = f.placeholder;
    ta.value = state.summary[f.key] || '';
    ta.addEventListener('input', () => { state.summary[f.key] = ta.value; });
    container.appendChild(ta);
  });
}

/* ============ 場所カード ============ */
function addLocation(preset){
  const id = 'loc' + (++locIdCounter);
  const p = preset || getLocationPresets()[0];
  state.locations.push({ id, preset: p, customName:'', memo: getPresetMemo(p), assistLevel: '', photos: [] });
  renderLocations();
}
function removeLocation(id){
  if(!confirm('この場所を削除します。よろしいですか？')) return;
  state.locations = state.locations.filter(l => l.id !== id);
  renderLocations();
}
function renderLocations(){
  const container = document.getElementById('locationsContainer');
  container.innerHTML = '';
  state.locations.forEach(loc => {
    const card = document.createElement('div');
    card.className = 'loc-card';
    card.dataset.id = loc.id;

    const head = document.createElement('div');
    head.className = 'loc-card-head';
    const select = document.createElement('select');
    getLocationPresets().forEach(p => {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      if(p === loc.preset) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => {
      loc.preset = select.value;
      const allPresetMemos = Object.values(getDocType().memoPresets);
      if(!loc.memo || allPresetMemos.includes(loc.memo)){
        loc.memo = getPresetMemo(loc.preset);
      }
      renderLocations();
    });
    head.appendChild(select);
    card.appendChild(head);

    if(loc.preset === 'その他'){
      const customInput = document.createElement('input');
      customInput.type = 'text';
      customInput.placeholder = '場所名を入力（例：庭、階段、寝室2）';
      customInput.value = loc.customName;
      customInput.style.marginBottom = '8px';
      customInput.addEventListener('input', () => { loc.customName = customInput.value; });
      card.appendChild(customInput);
    }

    const memoLabel = document.createElement('label');
    memoLabel.textContent = '採寸・所見';
    card.appendChild(memoLabel);
    const memoArea = document.createElement('textarea');
    memoArea.value = loc.memo;
    memoArea.addEventListener('input', () => { loc.memo = memoArea.value; });
    card.appendChild(memoArea);

    const assistLabel = document.createElement('label');
    assistLabel.textContent = '介助レベル';
    card.appendChild(assistLabel);
    const assistSelect = document.createElement('select');
    const emptyOpt = document.createElement('option');
    emptyOpt.value = '';
    emptyOpt.textContent = '選択してください';
    if(!loc.assistLevel) emptyOpt.selected = true;
    assistSelect.appendChild(emptyOpt);
    ASSIST_LEVELS.forEach(level => {
      const opt = document.createElement('option');
      opt.value = level;
      opt.textContent = level;
      if(loc.assistLevel === level) opt.selected = true;
      assistSelect.appendChild(opt);
    });
    assistSelect.addEventListener('change', () => { loc.assistLevel = assistSelect.value; });
    card.appendChild(assistSelect);

    const photoLabel = document.createElement('label');
    photoLabel.textContent = '写真';
    card.appendChild(photoLabel);
    const photoGrid = document.createElement('div');
    photoGrid.className = 'photo-grid';
    renderPhotoGrid(photoGrid, loc);
    card.appendChild(photoGrid);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn-danger loc-remove';
    removeBtn.textContent = '削除';
    removeBtn.addEventListener('click', () => removeLocation(loc.id));
    card.appendChild(removeBtn);

    container.appendChild(card);
  });
}

function renderPhotoGrid(gridEl, loc){
  gridEl.innerHTML = '';
  loc.photos.forEach((photo, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'photo-thumb';
    const img = document.createElement('img');
    img.src = photo.dataUrl;
    thumb.appendChild(img);
    const delBtn = document.createElement('button');
    delBtn.textContent = '×';
    delBtn.addEventListener('click', () => {
      loc.photos.splice(idx, 1);
      renderPhotoGrid(gridEl, loc);
    });
    thumb.appendChild(delBtn);
    gridEl.appendChild(thumb);
  });

  const addBtn = document.createElement('label');
  addBtn.className = 'photo-add-btn';
  addBtn.textContent = '＋ 写真';
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.multiple = true;
  input.style.display = 'none';
  input.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    for(const file of files){
      let photo;
      try{
        photo = await normalizeImage(file);
      }catch(err){
        console.error('画像補正に失敗、元画像をそのまま使用します', err);
        photo = { dataUrl: await fileToDataUrl(file), width: null, height: null };
      }
      loc.photos.push(photo);
    }
    renderPhotoGrid(gridEl, loc);
  });
  addBtn.appendChild(input);
  gridEl.appendChild(addBtn);
}

/* ============ 写真の自動リサイズ ============ */
/* 最近のブラウザは画像の向き(EXIF)を読み込み時に自動で正しく補正するため、
   ここでは向きの手動補正は行わず、リサイズのみ行う(二重回転を避けるため) */
function loadImageElement(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function normalizeImage(file){
  const MAX_DIM = 1600; // 長辺の上限px（ファイルサイズ対策）
  const objectUrl = URL.createObjectURL(file);
  let img;
  try{
    img = await loadImageElement(objectUrl);
  } finally {
    URL.revokeObjectURL(objectUrl);
  }

  // naturalWidth/naturalHeightはブラウザが向き補正した後のサイズ
  const width = img.naturalWidth, height = img.naturalHeight;
  let drawWidth = width, drawHeight = height;
  const longSide = Math.max(width, height);
  if(longSide > MAX_DIM){
    const scale = MAX_DIM / longSide;
    drawWidth = Math.round(width * scale);
    drawHeight = Math.round(height * scale);
  }

  const canvas = document.createElement('canvas');
  canvas.width = drawWidth;
  canvas.height = drawHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, drawWidth, drawHeight);

  return {
    dataUrl: canvas.toDataURL('image/jpeg', 0.85),
    width: canvas.width,
    height: canvas.height
  };
}

function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ 共通ユーティリティ ============ */
function locName(loc){
  return loc.preset === 'その他' ? (loc.customName || 'その他') : loc.preset;
}
function fileBaseName(){
  const name = (state.header.taisho || '未入力').replace(/[\\/:*?"<>|　\s]/g,'');
  const date = state.header.jisshibi || '';
  return `${getDocType().label}_${name}_${date}`;
}
function showStatus(msg, autoHide){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.style.display = 'block';
  if(autoHide){
    setTimeout(() => { el.style.display = 'none'; }, 2500);
  }
}
function hideStatus(){
  document.getElementById('statusMsg').style.display = 'none';
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

document.getElementById('progressFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const obj = JSON.parse(text);
    if(!obj || !obj.state || !obj.state.locations) throw new Error('作業データの形式が正しくありません');

    if(obj.docType && DOC_TYPES[obj.docType]){
      currentDocType = obj.docType;
      document.getElementById('docTypeSelect').value = currentDocType;
    }
    state = obj.state;
    state.summary = state.summary || { kaigidate:'', sankasha:'' };

    // 場所IDカウンターの衝突を避けるため、既存の最大値から再開
    locIdCounter = state.locations.reduce((max, l) => {
      const num = parseInt(String(l.id).replace('loc',''), 10);
      return isNaN(num) ? max : Math.max(max, num);
    }, 0);

    document.getElementById('appTitleHeading').textContent = getDocType().title + ' 報告書作成';
    document.title = getDocType().title + ' 報告書作成';
    fieldMap.forEach(([id, group, key]) => {
      document.getElementById(id).value = (state[group] && state[group][key]) || '';
    });
    renderSummaryFields();
    renderLocations();
    showStatus('作業データを読み込みました', true);
  }catch(err){
    console.error(err);
    alert('読み込みに失敗しました。ファイルが壊れているか、対応していない形式です。\n' + err.message);
  }
});

function buildReportDom(){
  const root = document.createElement('div');
  root.style.width = '760px';
  root.style.padding = '24px';
  root.style.background = '#ffffff';
  root.style.fontFamily = '"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  root.style.color = '#222';
  root.style.fontSize = '13px';
  root.style.lineHeight = '1.7';

  const title = document.createElement('div');
  title.className = 'pdf-block';
  title.style.fontSize = '20px';
  title.style.fontWeight = 'bold';
  title.style.textAlign = 'center';
  title.style.marginBottom = '16px';
  title.style.borderBottom = '3px solid #2f6f68';
  title.style.paddingBottom = '10px';
  title.textContent = getDocType().title;
  root.appendChild(title);

  const headerBlock = document.createElement('div');
  headerBlock.className = 'pdf-block';
  headerBlock.style.marginBottom = '20px';
  const headerRows = [
    ['対象利用者', state.header.taisho], ['実施日', state.header.jisshibi],
    ['実施場所', state.header.basho], ['参加メンバー', state.header.member],
    ['報告者', state.header.hokokusha], ['目的', state.header.mokuteki]
  ];
  headerRows.forEach(([label, val]) => {
    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.borderBottom = '1px solid #ddd';
    row.style.padding = '6px 0';
    const l = document.createElement('div');
    l.textContent = label;
    l.style.width = '110px';
    l.style.fontWeight = 'bold';
    l.style.color = '#2f6f68';
    l.style.flexShrink = '0';
    const v = document.createElement('div');
    v.textContent = val || '';
    v.style.whiteSpace = 'pre-wrap';
    row.appendChild(l); row.appendChild(v);
    headerBlock.appendChild(row);
  });
  root.appendChild(headerBlock);

  state.locations.forEach(loc => {
    const block = document.createElement('div');
    block.className = 'pdf-block';
    block.style.marginBottom = '18px';
    block.style.pageBreakInside = 'avoid';

    const h = document.createElement('div');
    h.textContent = '【' + locName(loc) + '】';
    h.style.fontSize = '15px';
    h.style.fontWeight = 'bold';
    h.style.background = '#eef4f1';
    h.style.color = '#204d47';
    h.style.padding = '6px 10px';
    h.style.borderRadius = '4px';
    h.style.marginBottom = '8px';
    block.appendChild(h);

    const memo = document.createElement('div');
    memo.textContent = loc.memo || '';
    memo.style.whiteSpace = 'pre-wrap';
    memo.style.marginBottom = '8px';
    block.appendChild(memo);

    if(loc.assistLevel){
      const assist = document.createElement('div');
      assist.textContent = '介助レベル：' + loc.assistLevel;
      assist.style.fontWeight = 'bold';
      assist.style.color = '#204d47';
      assist.style.marginBottom = '8px';
      block.appendChild(assist);
    }

    if(loc.photos.length){
      const grid = document.createElement('div');
      grid.style.display = 'flex';
      grid.style.flexWrap = 'wrap';
      grid.style.alignItems = 'flex-start';
      grid.style.gap = '10px';
      const MAX_BOX = 220; // 写真1枚あたりの最大枠(縦横共通)
      loc.photos.forEach(photo => {
        let w = MAX_BOX, h = MAX_BOX;
        if(photo.width && photo.height){
          const scale = Math.min(MAX_BOX / photo.width, MAX_BOX / photo.height);
          w = Math.round(photo.width * scale);
          h = Math.round(photo.height * scale);
        }
        const img = document.createElement('img');
        img.src = photo.dataUrl;
        img.style.width = w + 'px';
        img.style.height = h + 'px';
        img.style.objectFit = 'contain';
        img.style.border = '1px solid #ccc';
        img.style.borderRadius = '4px';
        img.style.background = '#fafafa';
        grid.appendChild(img);
      });
      block.appendChild(grid);
    }
    root.appendChild(block);
  });

  const summaryBlock = document.createElement('div');
  summaryBlock.className = 'pdf-block';
  getDocType().summary.forEach(f => {
    const sub = document.createElement('div');
    sub.style.marginBottom = '12px';
    const h = document.createElement('div');
    h.textContent = '○' + f.label;
    h.style.fontWeight = 'bold';
    h.style.color = '#2f6f68';
    h.style.marginBottom = '4px';
    const p = document.createElement('div');
    p.textContent = state.summary[f.key] || '';
    p.style.whiteSpace = 'pre-wrap';
    sub.appendChild(h); sub.appendChild(p);
    summaryBlock.appendChild(sub);
  });
  const meta = document.createElement('div');
  meta.style.marginTop = '10px';
  meta.style.fontSize = '12px';
  meta.style.color = '#555';
  meta.textContent = `会議実施日：${state.summary.kaigidate || ''}　参加者：${state.summary.sankasha || ''}`;
  summaryBlock.appendChild(meta);
  root.appendChild(summaryBlock);

  root.style.position = 'fixed';
  root.style.left = '-9999px';
  root.style.top = '0';
  return root;
}

async function buildPdf(){
  const el = buildReportDom();
  document.body.appendChild(el);
  await new Promise(r => setTimeout(r, 50)); // レイアウト確定待ち

  const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
  const blocks = Array.from(el.querySelectorAll('.pdf-block')).map(b => ({
    top: b.offsetTop * 2, height: b.offsetHeight * 2 // scale:2 と合わせる
  }));
  document.body.removeChild(el);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pageWmm = 210, pageHmm = 297;
  const pxPerMm = canvas.width / pageWmm;
  const pageHpx = pageHmm * pxPerMm;

  // ブロック境界を尊重した改ページ位置を計算
  let breakpoints = [0];
  let pageStart = 0;
  blocks.forEach(b => {
    const bottom = b.top + b.height;
    if(bottom - pageStart > pageHpx && b.top > pageStart){
      breakpoints.push(b.top);
      pageStart = b.top;
    }
  });
  breakpoints.push(canvas.height);

  // 1ページ分を超えるブロックがあれば機械的に分割
  let segments = [];
  for(let i = 0; i < breakpoints.length - 1; i++){
    let start = breakpoints[i], end = breakpoints[i+1];
    while(end - start > pageHpx){
      segments.push([start, start + pageHpx]);
      start += pageHpx;
    }
    if(end > start) segments.push([start, end]);
  }

  segments.forEach(([start, end], idx) => {
    const sliceH = end - start;
    if(sliceH <= 0) return;
    const pageCanvas = document.createElement('canvas');
    pageCanvas.width = canvas.width;
    pageCanvas.height = sliceH;
    const ctx = pageCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
    ctx.drawImage(canvas, 0, start, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
    const imgData = pageCanvas.toDataURL('image/jpeg', 0.92);
    if(idx > 0) pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, 0, pageWmm, sliceH / pxPerMm);
  });

  pdf.save(fileBaseName() + '.pdf');
}

function dataUrlToBase64AndExt(dataUrl){
  const match = /^data:image\/(\w+);base64,(.*)$/.exec(dataUrl);
  if(!match) return { base64: dataUrl, ext: 'jpeg' };
  let ext = match[1].toLowerCase();
  if(ext === 'jpg') ext = 'jpeg';
  if(!['jpeg','png','gif'].includes(ext)) ext = 'jpeg';
  return { base64: match[2], ext };
}

async function buildExcel(){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(getDocType().label, { pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1 } });
  ws.columns = Array.from({length: 8}, () => ({ width: 13 }));

  let r = 1;
  ws.mergeCells(r, 1, r, 8);
  const titleCell = ws.getCell(r, 1);
  titleCell.value = getDocType().title;
  titleCell.font = { bold: true, size: 16 };
  titleCell.alignment = { horizontal: 'center' };
  r += 2;

  const headerRows = [
    ['対象利用者', state.header.taisho], ['実施日', state.header.jisshibi],
    ['実施場所', state.header.basho], ['参加メンバー', state.header.member],
    ['報告者', state.header.hokokusha], ['目的', state.header.mokuteki]
  ];
  headerRows.forEach(([label, val]) => {
    ws.getCell(r, 1).value = label;
    ws.getCell(r, 1).font = { bold: true };
    ws.getCell(r, 1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF4F1' } };
    ws.mergeCells(r, 2, r, 8);
    ws.getCell(r, 2).value = val || '';
    ws.getCell(r, 2).alignment = { wrapText: true };
    r++;
  });
  r += 1;

  const PX_TO_ROW = 0.13; // 1px ≒ 何行分の目安（既定の行高18px前提のざっくり換算）
  const PHOTO_W = 200, PHOTO_H = 200; // 縦横どちらの写真も収まる正方形寄りの最大枠

  for(const loc of state.locations){
    ws.mergeCells(r, 1, r, 8);
    const h = ws.getCell(r, 1);
    h.value = '【' + locName(loc) + '】';
    h.font = { bold: true, size: 13, color: { argb: 'FF204D47' } };
    h.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF4F1' } };
    r++;

    const memoStartRow = r;
    const photoRows = Math.ceil(PHOTO_H * PX_TO_ROW) + 1; // 写真1枚分の高さに必要な行数
    const memoEndRow = memoStartRow + photoRows - 1;
    ws.mergeCells(memoStartRow, 1, memoEndRow, 3);
    const memoCell = ws.getCell(memoStartRow, 1);
    let memoText = loc.memo || '';
    if(loc.assistLevel){
      memoText += (memoText ? '\n\n' : '') + '介助レベル：' + loc.assistLevel;
    }
    memoCell.value = memoText;
    memoCell.alignment = { wrapText: true, vertical: 'top' };

    let col = 4; // D列から写真開始
    let rowOffset = memoStartRow - 1;
    loc.photos.forEach((photo, idx) => {
      if(idx > 0 && idx % 2 === 0){ col = 4; rowOffset += photoRows; }
      const { base64, ext } = dataUrlToBase64AndExt(photo.dataUrl);
      const imgId = wb.addImage({ base64, extension: ext });
      // 縦横比を保ったまま PHOTO_W×PHOTO_H の枠内に収める(引き伸ばし防止)
      let fitW = PHOTO_W, fitH = PHOTO_H;
      if(photo.width && photo.height){
        const scale = Math.min(PHOTO_W / photo.width, PHOTO_H / photo.height);
        fitW = Math.round(photo.width * scale);
        fitH = Math.round(photo.height * scale);
      }
      ws.addImage(imgId, {
        tl: { col: col - 1, row: rowOffset },
        ext: { width: fitW, height: fitH }
      });
      col += 2;
    });

    const extraRowsForPhotos = loc.photos.length > 2 ? photoRows : 0;
    r = memoEndRow + 1 + extraRowsForPhotos + 1;
  }

  r += 1;
  getDocType().summary.forEach(f => {
    ws.mergeCells(r, 1, r, 8);
    const lc = ws.getCell(r, 1);
    lc.value = '○' + f.label;
    lc.font = { bold: true, color: { argb: 'FF2F6F68' } };
    r++;
    ws.mergeCells(r, 1, r + 3, 8);
    const vc = ws.getCell(r, 1);
    vc.value = state.summary[f.key] || '';
    vc.alignment = { wrapText: true, vertical: 'top' };
    r += 5;
  });

  ws.mergeCells(r, 1, r, 4);
  ws.getCell(r, 1).value = '会議実施日：' + (state.summary.kaigidate || '');
  ws.mergeCells(r, 5, r, 8);
  ws.getCell(r, 5).value = '参加者：' + (state.summary.sankasha || '');

  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(new Blob([buf], { type: 'application/octet-stream' }), fileBaseName() + '.xlsx');
}
