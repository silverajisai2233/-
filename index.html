<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入所前後訪問 報告書作成</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --main-color:#2f6f68;
    --main-dark:#204d47;
    --accent-color:#e08a3c;
    --bg-color:#f5f3ee;
    --card-bg:#ffffff;
    --border-color:#dcd6c8;
    --text-color:#333333;
    --danger-color:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg-color);
    color:var(--text-color);
    padding-bottom:100px;
  }
  header{
    background:var(--main-color);
    color:#fff;
    padding:16px 20px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  header h1{margin:0;font-size:18px;font-weight:600;}
  header p{margin:4px 0 0;font-size:12px;opacity:0.85;}
  main{max-width:720px;margin:0 auto;padding:16px;}
  section.card{
    background:var(--card-bg);
    border:1px solid var(--border-color);
    border-radius:10px;
    padding:16px;
    margin-bottom:18px;
  }
  section.card h2{
    font-size:15px;
    margin:0 0 12px;
    color:var(--main-dark);
    border-left:5px solid var(--accent-color);
    padding-left:8px;
  }
  label{display:block;font-size:12px;color:#666;margin:10px 0 4px;}
  input[type="text"], input[type="date"], textarea, select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border-color);
    border-radius:6px;
    font-size:15px;
    font-family:inherit;
    background:#fff;
  }
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  .loc-card{
    border:1px solid var(--border-color);
    border-radius:8px;
    padding:12px;
    margin-bottom:14px;
    background:#fbfaf6;
    position:relative;
  }
  .loc-card-head{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .loc-card-head select{flex:1;}
  .btn{
    display:inline-block;
    border:none;
    border-radius:6px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .btn-main{background:var(--main-color);color:#fff;}
  .btn-main:active{background:var(--main-dark);}
  .btn-outline{background:#fff;color:var(--main-color);border:1px solid var(--main-color);}
  .btn-danger{background:#fff;color:var(--danger-color);border:1px solid var(--danger-color);font-size:12px;padding:6px 10px;}
  .btn-add{width:100%;background:#eef4f1;color:var(--main-dark);border:1px dashed var(--main-color);padding:12px;font-size:14px;}
  .photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .photo-thumb{position:relative;width:88px;height:88px;border-radius:6px;overflow:hidden;border:1px solid var(--border-color);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb button{
    position:absolute;top:2px;right:2px;
    background:rgba(192,57,41,0.9);color:#fff;border:none;border-radius:50%;
    width:20px;height:20px;font-size:12px;line-height:20px;padding:0;cursor:pointer;
  }
  .photo-add-btn{
    width:88px;height:88px;border-radius:6px;border:1px dashed var(--main-color);
    background:#eef4f1;color:var(--main-color);font-size:12px;display:flex;
    align-items:center;justify-content:center;text-align:center;cursor:pointer;
  }
  .loc-remove{position:absolute;top:8px;right:8px;}
  .footer-actions{
    position:fixed;bottom:0;left:0;right:0;
    background:#fff;border-top:1px solid var(--border-color);
    padding:10px 16px;display:flex;gap:10px;z-index:20;
    box-shadow:0 -2px 8px rgba(0,0,0,0.08);
  }
  .footer-actions .btn{flex:1;}
  #statusMsg{
    position:fixed;top:70px;left:50%;transform:translateX(-50%);
    background:var(--main-dark);color:#fff;padding:8px 16px;border-radius:20px;
    font-size:13px;z-index:30;display:none;
  }
  .small-link{background:none;border:none;color:var(--main-color);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}
  .two-col{display:flex;gap:10px;}
  .two-col > div{flex:1;}
</style>
</head>
<body>

<header>
  <h1>入所前後訪問 報告書作成</h1>
  <p>撮影・入力してPDFまたはExcelを書き出します</p>
</header>

<div id="statusMsg"></div>

<main>

  <section class="card">
    <h2>基本情報</h2>
    <label>対象利用者</label>
    <input type="text" id="f_taisho" placeholder="〇〇 〇〇 様">
    <label>実施日</label>
    <input type="date" id="f_jisshibi">
    <label>実施場所</label>
    <input type="text" id="f_basho" placeholder="〇〇様自宅（神戸市北区）">
    <label>参加メンバー</label>
    <textarea id="f_member" placeholder="ご家族名・本人・同行職員など"></textarea>
    <label>報告者</label>
    <input type="text" id="f_hokokusha" placeholder="シルバーステイあじさい　理学療法士　〇〇 〇〇">
    <label>目的</label>
    <textarea id="f_mokuteki" placeholder="入所前の生活状況の確認と計画書作成、認知症リハビリのため"></textarea>
  </section>

  <section class="card">
    <h2>住宅環境評価</h2>
    <div id="locationsContainer"></div>
    <button class="btn-add" id="btnAddLocation">＋ 場所を追加</button>
  </section>

  <section class="card">
    <h2>まとめ・考察</h2>
    <label>自宅での様子</label>
    <textarea id="s_yousu" placeholder="体調悪化や入院前のADL状況、家庭での役割・参加、介護保険サービスの利用状況、1日の過ごし方、入所に至る経緯など"></textarea>
    <label>入所生活</label>
    <textarea id="s_seikatsu" placeholder="退所時にどのレベルまでADLや精神機能等を高めていくのか（生活目標）、施設での生活で注意すること、生活リハビリの内容など"></textarea>
    <label>リハビリ</label>
    <textarea id="s_rehabili" placeholder="リハビリの最終ゴール設定とそれに至るまでの目標、現状の問題点に対する予後予測など"></textarea>
    <label>今後の予定</label>
    <textarea id="s_yotei" placeholder="自宅に帰った場合の役割、家族への支援依頼、必要な介護保険サービス、住宅環境整備・福祉用具の要否など"></textarea>
    <div class="two-col">
      <div>
        <label>会議実施日</label>
        <input type="date" id="s_kaigidate">
      </div>
      <div>
        <label>参加者</label>
        <input type="text" id="s_sankasha" placeholder="PT〇〇、CM〇〇、CW〇〇、NS〇〇">
      </div>
    </div>
  </section>

  <button class="btn btn-outline" style="width:100%;margin-bottom:40px;" id="btnReset">入力内容をすべてクリア</button>

</main>

<div class="footer-actions">
  <button class="btn btn-outline" id="btnExcel">Excel作成</button>
  <button class="btn btn-main" id="btnPdf">PDF作成</button>
</div>

<script>
/* ============ 定数 ============ */
const LOCATION_PRESETS = ['門扉〜玄関','玄関','廊下','トイレ','居室','寝室','浴室','その他'];

const PRESET_MEMO = {
  '門扉〜玄関': '階段の高さ：\n階段の段数：　　段\n手すりの有無（　　）\nその他：',
  '玄関':      '上がり框の高さ：　　㎝\n手すりの有無（　　）\nその他：',
  '廊下':      '廊下の幅：\n手すりの有無（　　）\nその他：',
  'トイレ':     '便座の高さ：　　㎝\n手すりの有無（　　）\nその他：',
  '居室':      '机の高さ：\n椅子の高さ：\nその他：',
  '寝室':      'ベッドの高さ：\nベッド柵・手すりの有無（　　）\nその他：',
  '浴室':      '浴槽の高さ：内側　㎝　外側　㎝\nシャワーチェアの高さ：　　㎝\nその他：',
  'その他':     ''
};

/* ============ 状態 ============ */
let state = {
  header: { taisho:'', jisshibi:'', basho:'', member:'', hokokusha:'', mokuteki:'' },
  locations: [],
  summary: { yousu:'', seikatsu:'', rehabili:'', yotei:'', kaigidate:'', sankasha:'' }
};
let locIdCounter = 0;

/* ============ 基本情報 / まとめ：双方向バインド ============ */
const fieldMap = [
  ['f_taisho','header','taisho'], ['f_jisshibi','header','jisshibi'], ['f_basho','header','basho'],
  ['f_member','header','member'], ['f_hokokusha','header','hokokusha'], ['f_mokuteki','header','mokuteki'],
  ['s_yousu','summary','yousu'], ['s_seikatsu','summary','seikatsu'], ['s_rehabili','summary','rehabili'],
  ['s_yotei','summary','yotei'], ['s_kaigidate','summary','kaigidate'], ['s_sankasha','summary','sankasha']
];
fieldMap.forEach(([id, group, key]) => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => { state[group][key] = el.value; });
});

/* ============ 場所カード ============ */
function addLocation(preset){
  const id = 'loc' + (++locIdCounter);
  const p = preset || LOCATION_PRESETS[0];
  state.locations.push({ id, preset: p, customName:'', memo: PRESET_MEMO[p] || '', photos: [] });
  renderLocations();
}
function removeLocation(id){
  if(!confirm('この場所を削除します。よろしいですか？')) return;
  state.locations = state.locations.filter(l => l.id !== id);
  renderLocations();
}
function renderLocations(){
  const container = document.getElementById('locationsContainer');
  container.innerHTML = '';
  state.locations.forEach(loc => {
    const card = document.createElement('div');
    card.className = 'loc-card';
    card.dataset.id = loc.id;

    const head = document.createElement('div');
    head.className = 'loc-card-head';
    const select = document.createElement('select');
    LOCATION_PRESETS.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      if(p === loc.preset) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => {
      loc.preset = select.value;
      if(!loc.memo || Object.values(PRESET_MEMO).includes(loc.memo)){
        loc.memo = PRESET_MEMO[loc.preset] || '';
      }
      renderLocations();
    });
    head.appendChild(select);
    card.appendChild(head);

    if(loc.preset === 'その他'){
      const customInput = document.createElement('input');
      customInput.type = 'text';
      customInput.placeholder = '場所名を入力（例：庭、階段、寝室2）';
      customInput.value = loc.customName;
      customInput.style.marginBottom = '8px';
      customInput.addEventListener('input', () => { loc.customName = customInput.value; });
      card.appendChild(customInput);
    }

    const memoLabel = document.createElement('label');
    memoLabel.textContent = '採寸・所見';
    card.appendChild(memoLabel);
    const memoArea = document.createElement('textarea');
    memoArea.value = loc.memo;
    memoArea.addEventListener('input', () => { loc.memo = memoArea.value; });
    card.appendChild(memoArea);

    const photoLabel = document.createElement('label');
    photoLabel.textContent = '写真';
    card.appendChild(photoLabel);
    const photoGrid = document.createElement('div');
    photoGrid.className = 'photo-grid';
    renderPhotoGrid(photoGrid, loc);
    card.appendChild(photoGrid);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn-danger loc-remove';
    removeBtn.textContent = '削除';
    removeBtn.addEventListener('click', () => removeLocation(loc.id));
    card.appendChild(removeBtn);

    container.appendChild(card);
  });
}

function renderPhotoGrid(gridEl, loc){
  gridEl.innerHTML = '';
  loc.photos.forEach((photo, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'photo-thumb';
    const img = document.createElement('img');
    img.src = photo.dataUrl;
    thumb.appendChild(img);
    const delBtn = document.createElement('button');
    delBtn.textContent = '×';
    delBtn.addEventListener('click', () => {
      loc.photos.splice(idx, 1);
      renderPhotoGrid(gridEl, loc);
    });
    thumb.appendChild(delBtn);
    gridEl.appendChild(thumb);
  });

  const addBtn = document.createElement('label');
  addBtn.className = 'photo-add-btn';
  addBtn.textContent = '＋ 写真';
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.multiple = true;
  input.style.display = 'none';
  input.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    for(const file of files){
      let photo;
      try{
        photo = await normalizeImage(file);
      }catch(err){
        console.error('画像補正に失敗、元画像をそのまま使用します', err);
        photo = { dataUrl: await fileToDataUrl(file), width: null, height: null };
      }
      loc.photos.push(photo);
    }
    renderPhotoGrid(gridEl, loc);
  });
  addBtn.appendChild(input);
  gridEl.appendChild(addBtn);
}

/* ============ 写真の向き補正・自動リサイズ ============ */
function getExifOrientation(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const view = new DataView(e.target.result);
        if(view.getUint16(0, false) !== 0xFFD8){ resolve(1); return; }
        const length = view.byteLength;
        let offset = 2;
        while(offset < length){
          const marker = view.getUint16(offset, false);
          offset += 2;
          if(marker === 0xFFE1){
            if(view.getUint32(offset + 2, false) !== 0x45786966){ resolve(1); return; }
            const little = view.getUint16(offset + 8, false) === 0x4949;
            const tiffOffset = offset + 8;
            const firstIFDOffset = view.getUint32(tiffOffset + 4, little);
            let dirOffset = tiffOffset + firstIFDOffset;
            const tags = view.getUint16(dirOffset, little);
            dirOffset += 2;
            for(let i = 0; i < tags; i++){
              const entryOffset = dirOffset + i * 12;
              if(view.getUint16(entryOffset, little) === 0x0112){
                resolve(view.getUint16(entryOffset + 8, little));
                return;
              }
            }
            resolve(1); return;
          } else if((marker & 0xFF00) !== 0xFF00){
            break;
          } else {
            offset += view.getUint16(offset, false);
          }
        }
        resolve(1);
      }catch(err){
        resolve(1);
      }
    };
    reader.onerror = () => resolve(1);
    reader.readAsArrayBuffer(file.slice(0, 128 * 1024));
  });
}

function loadImageElement(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function normalizeImage(file){
  const MAX_DIM = 1600; // 長辺の上限px（ファイルサイズ対策）
  const orientation = await getExifOrientation(file);
  const objectUrl = URL.createObjectURL(file);
  let img;
  try{
    img = await loadImageElement(objectUrl);
  } finally {
    URL.revokeObjectURL(objectUrl);
  }

  const width = img.naturalWidth, height = img.naturalHeight;
  const swap = orientation >= 5 && orientation <= 8;

  let drawWidth = width, drawHeight = height;
  const longSide = Math.max(width, height);
  if(longSide > MAX_DIM){
    const scale = MAX_DIM / longSide;
    drawWidth = Math.round(width * scale);
    drawHeight = Math.round(height * scale);
  }

  const canvas = document.createElement('canvas');
  canvas.width = swap ? drawHeight : drawWidth;
  canvas.height = swap ? drawWidth : drawHeight;
  const ctx = canvas.getContext('2d');

  switch(orientation){
    case 2: ctx.transform(-1, 0, 0, 1, canvas.width, 0); break;
    case 3: ctx.transform(-1, 0, 0, -1, canvas.width, canvas.height); break;
    case 4: ctx.transform(1, 0, 0, -1, 0, canvas.height); break;
    case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
    case 6: ctx.transform(0, 1, -1, 0, canvas.width, 0); break;
    case 7: ctx.transform(0, -1, -1, 0, canvas.width, canvas.height); break;
    case 8: ctx.transform(0, -1, 1, 0, 0, canvas.height); break;
    default: break;
  }

  ctx.drawImage(img, 0, 0, drawWidth, drawHeight);
  return {
    dataUrl: canvas.toDataURL('image/jpeg', 0.85),
    width: canvas.width,
    height: canvas.height
  };
}

function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('btnAddLocation').addEventListener('click', () => addLocation());

document.getElementById('btnReset').addEventListener('click', () => {
  if(!confirm('入力した内容をすべて消去します。よろしいですか？')) return;
  state = { header:{taisho:'',jisshibi:'',basho:'',member:'',hokokusha:'',mokuteki:''}, locations:[], summary:{yousu:'',seikatsu:'',rehabili:'',yotei:'',kaigidate:'',sankasha:''} };
  fieldMap.forEach(([id]) => { document.getElementById(id).value = ''; });
  renderLocations();
});

/* 初期状態で1つ場所カードを用意 */
addLocation('門扉〜玄関');

/* ============ 共通ユーティリティ ============ */
function locName(loc){
  return loc.preset === 'その他' ? (loc.customName || 'その他') : loc.preset;
}
function fileBaseName(){
  const name = (state.header.taisho || '未入力').replace(/[\\/:*?"<>|　\s]/g,'');
  const date = state.header.jisshibi || '';
  return `入所前後訪問_${name}_${date}`;
}
function showStatus(msg, autoHide){
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.style.display = 'block';
  if(autoHide){
    setTimeout(() => { el.style.display = 'none'; }, 2500);
  }
}
function hideStatus(){
  document.getElementById('statusMsg').style.display = 'none';
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* ============ PDF出力 ============ */
document.getElementById('btnPdf').addEventListener('click', async () => {
  try{
    showStatus('PDFを作成しています…');
    await buildPdf();
    showStatus('PDFを保存しました', true);
  }catch(err){
    console.error(err);
    hideStatus();
    alert('PDF作成でエラーが発生しました。内容をスクリーンショットで送ってください。\n' + err.message);
  }
});

function buildReportDom(){
  const root = document.createElement('div');
  root.style.width = '760px';
  root.style.padding = '24px';
  root.style.background = '#ffffff';
  root.style.fontFamily = '"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  root.style.color = '#222';
  root.style.fontSize = '13px';
  root.style.lineHeight = '1.7';

  const title = document.createElement('div');
  title.className = 'pdf-block';
  title.style.fontSize = '20px';
  title.style.fontWeight = 'bold';
  title.style.textAlign = 'center';
  title.style.marginBottom = '16px';
  title.style.borderBottom = '3px solid #2f6f68';
  title.style.paddingBottom = '10px';
  title.textContent = '入所前後訪問指導';
  root.appendChild(title);

  const headerBlock = document.createElement('div');
  headerBlock.className = 'pdf-block';
  headerBlock.style.marginBottom = '20px';
  const headerRows = [
    ['対象利用者', state.header.taisho], ['実施日', state.header.jisshibi],
    ['実施場所', state.header.basho], ['参加メンバー', state.header.member],
    ['報告者', state.header.hokokusha], ['目的', state.header.mokuteki]
  ];
  headerRows.forEach(([label, val]) => {
    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.borderBottom = '1px solid #ddd';
    row.style.padding = '6px 0';
    const l = document.createElement('div');
    l.textContent = label;
    l.style.width = '110px';
    l.style.fontWeight = 'bold';
    l.style.color = '#2f6f68';
    l.style.flexShrink = '0';
    const v = document.createElement('div');
    v.textContent = val || '';
    v.style.whiteSpace = 'pre-wrap';
    row.appendChild(l); row.appendChild(v);
    headerBlock.appendChild(row);
  });
  root.appendChild(headerBlock);

  state.locations.forEach(loc => {
    const block = document.createElement('div');
    block.className = 'pdf-block';
    block.style.marginBottom = '18px';
    block.style.pageBreakInside = 'avoid';

    const h = document.createElement('div');
    h.textContent = '【' + locName(loc) + '】';
    h.style.fontSize = '15px';
    h.style.fontWeight = 'bold';
    h.style.background = '#eef4f1';
    h.style.color = '#204d47';
    h.style.padding = '6px 10px';
    h.style.borderRadius = '4px';
    h.style.marginBottom = '8px';
    block.appendChild(h);

    const memo = document.createElement('div');
    memo.textContent = loc.memo || '';
    memo.style.whiteSpace = 'pre-wrap';
    memo.style.marginBottom = '8px';
    block.appendChild(memo);

    if(loc.photos.length){
      const grid = document.createElement('div');
      grid.style.display = 'flex';
      grid.style.flexWrap = 'wrap';
      grid.style.gap = '10px';
      loc.photos.forEach(photo => {
        const img = document.createElement('img');
        img.src = photo.dataUrl;
        img.style.width = '220px';
        img.style.height = '165px';
        img.style.objectFit = 'cover';
        img.style.border = '1px solid #ccc';
        img.style.borderRadius = '4px';
        grid.appendChild(img);
      });
      block.appendChild(grid);
    }
    root.appendChild(block);
  });

  const summaryTitles = [
    ['自宅での様子', state.summary.yousu], ['入所生活', state.summary.seikatsu],
    ['リハビリ', state.summary.rehabili], ['今後の予定', state.summary.yotei]
  ];
  const summaryBlock = document.createElement('div');
  summaryBlock.className = 'pdf-block';
  summaryTitles.forEach(([label, val]) => {
    const sub = document.createElement('div');
    sub.style.marginBottom = '12px';
    const h = document.createElement('div');
    h.textContent = '○' + label;
    h.style.fontWeight = 'bold';
    h.style.color = '#2f6f68';
    h.style.marginBottom = '4px';
    const p = document.createElement('div');
    p.textContent = val || '';
    p.style.whiteSpace = 'pre-wrap';
    sub.appendChild(h); sub.appendChild(p);
    summaryBlock.appendChild(sub);
  });
  const meta = document.createElement('div');
  meta.style.marginTop = '10px';
  meta.style.fontSize = '12px';
  meta.style.color = '#555';
  meta.textContent = `会議実施日：${state.summary.kaigidate || ''}　参加者：${state.summary.sankasha || ''}`;
  summaryBlock.appendChild(meta);
  root.appendChild(summaryBlock);

  root.style.position = 'fixed';
  root.style.left = '-9999px';
  root.style.top = '0';
  return root;
}

async function buildPdf(){
  const el = buildReportDom();
  document.body.appendChild(el);
  await new Promise(r => setTimeout(r, 50)); // レイアウト確定待ち

  const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
  const blocks = Array.from(el.querySelectorAll('.pdf-block')).map(b => ({
    top: b.offsetTop * 2, height: b.offsetHeight * 2 // scale:2 と合わせる
  }));
  document.body.removeChild(el);

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pageWmm = 210, pageHmm = 297;
  const pxPerMm = canvas.width / pageWmm;
  const pageHpx = pageHmm * pxPerMm;

  // ブロック境界を尊重した改ページ位置を計算
  let breakpoints = [0];
  let pageStart = 0;
  blocks.forEach(b => {
    const bottom = b.top + b.height;
    if(bottom - pageStart > pageHpx && b.top > pageStart){
      breakpoints.push(b.top);
      pageStart = b.top;
    }
  });
  breakpoints.push(canvas.height);

  // 1ページ分を超えるブロックがあれば機械的に分割
  let segments = [];
  for(let i = 0; i < breakpoints.length - 1; i++){
    let start = breakpoints[i], end = breakpoints[i+1];
    while(end - start > pageHpx){
      segments.push([start, start + pageHpx]);
      start += pageHpx;
    }
    if(end > start) segments.push([start, end]);
  }

  segments.forEach(([start, end], idx) => {
    const sliceH = end - start;
    if(sliceH <= 0) return;
    const pageCanvas = document.createElement('canvas');
    pageCanvas.width = canvas.width;
    pageCanvas.height = sliceH;
    const ctx = pageCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
    ctx.drawImage(canvas, 0, start, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
    const imgData = pageCanvas.toDataURL('image/jpeg', 0.92);
    if(idx > 0) pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, 0, pageWmm, sliceH / pxPerMm);
  });

  pdf.save(fileBaseName() + '.pdf');
}

function dataUrlToBase64AndExt(dataUrl){
  const match = /^data:image\/(\w+);base64,(.*)$/.exec(dataUrl);
  if(!match) return { base64: dataUrl, ext: 'jpeg' };
  let ext = match[1].toLowerCase();
  if(ext === 'jpg') ext = 'jpeg';
  if(!['jpeg','png','gif'].includes(ext)) ext = 'jpeg';
  return { base64: match[2], ext };
}

async function buildExcel(){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('入所前後訪問', { pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1 } });
  ws.columns = Array.from({length: 8}, () => ({ width: 13 }));

  let r = 1;
  ws.mergeCells(r, 1, r, 8);
  const titleCell = ws.getCell(r, 1);
  titleCell.value = '入所前後訪問指導';
  titleCell.font = { bold: true, size: 16 };
  titleCell.alignment = { horizontal: 'center' };
  r += 2;

  const headerRows = [
    ['対象利用者', state.header.taisho], ['実施日', state.header.jisshibi],
    ['実施場所', state.header.basho], ['参加メンバー', state.header.member],
    ['報告者', state.header.hokokusha], ['目的', state.header.mokuteki]
  ];
  headerRows.forEach(([label, val]) => {
    ws.getCell(r, 1).value = label;
    ws.getCell(r, 1).font = { bold: true };
    ws.getCell(r, 1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF4F1' } };
    ws.mergeCells(r, 2, r, 8);
    ws.getCell(r, 2).value = val || '';
    ws.getCell(r, 2).alignment = { wrapText: true };
    r++;
  });
  r += 1;

  const PX_TO_ROW = 0.13; // 1px ≒ 何行分の目安（既定の行高18px前提のざっくり換算）
  const PHOTO_W = 200, PHOTO_H = 150;

  for(const loc of state.locations){
    ws.mergeCells(r, 1, r, 8);
    const h = ws.getCell(r, 1);
    h.value = '【' + locName(loc) + '】';
    h.font = { bold: true, size: 13, color: { argb: 'FF204D47' } };
    h.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF4F1' } };
    r++;

    const memoStartRow = r;
    const photoRows = Math.ceil(PHOTO_H * PX_TO_ROW) + 1; // 写真1枚分の高さに必要な行数
    const memoEndRow = memoStartRow + photoRows - 1;
    ws.mergeCells(memoStartRow, 1, memoEndRow, 3);
    const memoCell = ws.getCell(memoStartRow, 1);
    memoCell.value = loc.memo || '';
    memoCell.alignment = { wrapText: true, vertical: 'top' };

    let col = 4; // D列から写真開始
    let rowOffset = memoStartRow - 1;
    loc.photos.forEach((photo, idx) => {
      if(idx > 0 && idx % 2 === 0){ col = 4; rowOffset += photoRows; }
      const { base64, ext } = dataUrlToBase64AndExt(photo.dataUrl);
      const imgId = wb.addImage({ base64, extension: ext });
      // 縦横比を保ったまま PHOTO_W×PHOTO_H の枠内に収める(引き伸ばし防止)
      let fitW = PHOTO_W, fitH = PHOTO_H;
      if(photo.width && photo.height){
        const scale = Math.min(PHOTO_W / photo.width, PHOTO_H / photo.height);
        fitW = Math.round(photo.width * scale);
        fitH = Math.round(photo.height * scale);
      }
      ws.addImage(imgId, {
        tl: { col: col - 1, row: rowOffset },
        ext: { width: fitW, height: fitH }
      });
      col += 2;
    });

    const extraRowsForPhotos = loc.photos.length > 2 ? photoRows : 0;
    r = memoEndRow + 1 + extraRowsForPhotos + 1;
  }

  r += 1;
  const summaryTitles = [
    ['○自宅での様子', state.summary.yousu], ['○入所生活', state.summary.seikatsu],
    ['○リハビリ', state.summary.rehabili], ['○今後の予定', state.summary.yotei]
  ];
  summaryTitles.forEach(([label, val]) => {
    ws.mergeCells(r, 1, r, 8);
    const lc = ws.getCell(r, 1);
    lc.value = label;
    lc.font = { bold: true, color: { argb: 'FF2F6F68' } };
    r++;
    ws.mergeCells(r, 1, r + 3, 8);
    const vc = ws.getCell(r, 1);
    vc.value = val || '';
    vc.alignment = { wrapText: true, vertical: 'top' };
    r += 5;
  });

  ws.mergeCells(r, 1, r, 4);
  ws.getCell(r, 1).value = '会議実施日：' + (state.summary.kaigidate || '');
  ws.mergeCells(r, 5, r, 8);
  ws.getCell(r, 5).value = '参加者：' + (state.summary.sankasha || '');

  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(new Blob([buf], { type: 'application/octet-stream' }), fileBaseName() + '.xlsx');
}
